<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Faculty Desk | Tuition Desk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20">
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2.5">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow-md">
        <i class="fa-solid fa-chalkboard-user text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm font-extrabold text-white tracking-wide">Tuition Desk &bull; Faculty</h1>
        <p id="faculty-name-display" class="text-[10px] text-indigo-400 font-semibold">Subject Faculty</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button onclick="toggleAIDrawer()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white text-xs font-bold shadow-md flex items-center space-x-1 touch-btn">
        <i class="fa-solid fa-brain"></i>
        <span>AI Desk</span>
      </button>
      <button onclick="logout()" class="p-2 bg-slate-800 hover:bg-rose-900/50 rounded-xl text-slate-400 hover:text-rose-300">
        <i class="fa-solid fa-arrow-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto p-3.5 sm:p-4 space-y-4">
    <!-- Log Doubt Clearance Form -->
    <div class="bg-slate-800/60 p-4 rounded-2xl border border-slate-800 space-y-3">
      <h3 class="text-xs font-extrabold text-white uppercase tracking-wider flex items-center space-x-1.5">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span>Record Doubt Clearance Session</span>
      </h3>
      <form onsubmit="handleClearDoubt(event)" class="space-y-2.5 text-xs">
        <div>
          <label class="block text-[10px] font-bold text-slate-400 mb-1">SELECT STUDENT</label>
          <select id="doubt-student-select" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white"></select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="doubt-subject" required placeholder="Subject (e.g. Mathematics)" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
          <input type="text" id="doubt-topic" required placeholder="Topic / Concept" class="px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
        </div>
        <input type="text" id="doubt-remarks" placeholder="Notes (e.g. Explained quadratic sign formulas)" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 rounded-xl text-white" />
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-md touch-btn">
          Verify & Save Doubt Resolution
        </button>
      </form>
    </div>

    <!-- Active Student Cohort -->
    <div class="space-y-2">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Students in Cohort</h3>
      <div id="faculty-students-list" class="space-y-2"></div>
    </div>

    <!-- Solved Doubts Stream -->
    <div class="space-y-2">
      <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Recent Doubt Clearance Logs</h3>
      <div id="doubts-container" class="space-y-2"></div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/faculty.js"></script>
</body>
</html>
