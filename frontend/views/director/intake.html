<div class="space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-extrabold text-white uppercase tracking-wider">Admissions & Intake</h2>
        <div class="inline-flex p-0.5 bg-slate-900 rounded-lg border border-slate-800 text-xs font-bold">
            <button id="btn-mode-student" onclick="window.toggleIntakeMode('student')" class="px-3 py-1 rounded-md bg-indigo-600 text-white transition-colors">Student Enrollment</button>
            <button id="btn-mode-staff" onclick="window.toggleIntakeMode('staff')" class="px-3 py-1 rounded-md text-slate-400 hover:text-white transition-colors">Staff Registration</button>
        </div>
    </div>

    <div id="intake-student-panel" class="space-y-4">
        <form onsubmit="window.handleStudentEnroll(event)" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 shadow-sm">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">FIRST NAME *</label><input type="text" id="adm-fname" required placeholder="e.g. Rahul" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">LAST NAME *</label><input type="text" id="adm-lname" required placeholder="e.g. Sharma" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
            </div>
            
            <div class="grid grid-cols-3 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">CLASS *</label>
                    <select id="adm-class" onchange="window.handleIntakeClassChange()" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
                        <option value="1">Class 1</option><option value="2">Class 2</option><option value="3">Class 3</option>
                        <option value="4">Class 4</option><option value="5">Class 5</option><option value="6">Class 6</option>
                        <option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option>
                        <option value="10" selected>Class 10</option>
                        <option value="Inter 1">Inter 1st Year</option>
                        <option value="Inter 2">Inter 2nd Year</option>
                        <option value="B.Tech">B.Tech</option>
                    </select>
                </div>
                <div id="adm-board-wrapper">
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">BOARD / STREAM *</label>
                    <select id="adm-board" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
                        <option value="SSC">SSC (State Board)</option>
                        <option value="CBSE">CBSE</option>
                        <option value="ICSE">ICSE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 mb-1">GENDER *</label>
                    <select id="adm-gender" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">EXPECTED ARRIVAL TIME *</label><input type="time" id="adm-time" value="18:00" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">ADMISSION DATE *</label><input type="date" id="adm-date" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">SCHOOL NAME</label><input type="text" id="adm-school" placeholder="School name..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">LOCALITY / AREA</label><input type="text" id="adm-area" placeholder="Colony / Area..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">FATHER'S NAME</label><input type="text" id="adm-father-name" placeholder="Father name..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">FATHER'S PHONE *</label><input type="tel" id="adm-father-phone" required pattern="[0-9]{10}" placeholder="10-digit number" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">MOTHER'S NAME</label><input type="text" id="adm-mother-name" placeholder="Mother name..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">MOTHER'S PHONE</label><input type="tel" id="adm-mother-phone" pattern="[0-9]{10}" placeholder="10-digit number" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>

            <div>
                <label class="block text-[10px] font-bold text-slate-400 mb-1">ENROLLED SUBJECTS (CTRL/CMD + CLICK FOR MULTIPLE)</label>
                <div id="btech-subj-input" class="hidden mb-2 flex space-x-2">
                    <input type="text" id="custom-subj-val" placeholder="Custom engineering subjects (comma separated)..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
                </div>
                <select id="adm-subjects-multi" multiple size="4" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500 focus:outline-none">
                    <option value="Mathematics" selected>Mathematics</option>
                    <option value="Science" selected>Science</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Biology">Biology</option>
                    <option value="English">English</option>
                    <option value="Social Studies">Social Studies</option>
                    <option value="Telugu">Telugu</option>
                    <option value="Hindi">Hindi</option>
                </select>
            </div>

            <div><label class="block text-[10px] font-bold text-slate-400 mb-1">MONTHLY TUITION FEE (₹)</label><input type="number" id="adm-fee" value="1500" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-xs uppercase shadow-lg touch-btn">Complete Admission</button>
        </form>
        
        <div class="pt-4 border-t border-slate-800 space-y-2">
            <div class="flex justify-between items-center">
                <h4 class="font-extrabold text-white text-xs uppercase">Recently Admitted Roster</h4>
                <select id="adm-roster-class" onchange="window.renderAdmissionsRoster()" class="px-2 py-1 bg-slate-900 border border-slate-800 rounded-lg text-white text-[10px] focus:border-indigo-500">
                    <option value="ALL">All Classes</option>
                    <option value="10">Class 10</option>
                </select>
            </div>
            <div id="admissions-roster-list" class="space-y-2"></div>
        </div>
    </div>

    <div id="intake-staff-panel" class="hidden space-y-4">
        <div class="grid grid-cols-3 p-1 bg-slate-900 rounded-lg border border-slate-800 text-xs font-bold text-slate-400">
            <button id="srole-tutor" onclick="window.selectStaffRole('tutor')" class="py-1.5 rounded bg-indigo-600 text-white transition-colors shadow-sm">Tutor</button>
            <button id="srole-faculty" onclick="window.selectStaffRole('faculty')" class="py-1.5 rounded hover:text-white transition-colors">Sr. Faculty</button>
            <button id="srole-associate_director" onclick="window.selectStaffRole('associate_director')" class="py-1.5 rounded hover:text-white transition-colors">Assoc. Director</button>
        </div>
        <form onsubmit="window.handleStaffEnroll(event)" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-4 shadow-sm">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">FULL LEGAL NAME *</label><input type="text" id="staff-name" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">MOBILE PHONE *</label><input type="tel" id="staff-phone" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">GENDER *</label><select id="staff-gender" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"><option value="Male">Male</option><option value="Female">Female</option></select></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">JOINING DATE *</label><input type="date" id="staff-join-date" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>
            <div id="box-specialty" class="hidden">
                <label class="block text-[10px] font-bold text-slate-400 mb-1">FACULTY SPECIALTY</label>
                <input type="text" id="staff-specialty" placeholder="e.g. Pure Mathematics, Organic Chemistry" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
            </div>
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">LOGIN PASSWORD *</label><input type="password" id="staff-pass1" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">MONTHLY SALARY (₹) *</label><input type="number" id="staff-salary" value="15000" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>
            <button type="submit" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs uppercase touch-btn shadow-lg">Save Staff Record</button>
        </form>
        
        <div class="pt-4 border-t border-slate-800 space-y-2">
            <div class="grid grid-cols-2 p-1 bg-slate-900 rounded-lg border border-slate-800 text-[10px] font-bold text-slate-400">
                <button id="sroster-active" onclick="window.switchStaffRoster('ACTIVE')" class="py-1 bg-indigo-600 text-white rounded transition-colors shadow-sm">Active Staff</button>
                <button id="sroster-inactive" onclick="window.switchStaffRoster('INACTIVE')" class="py-1 transition-colors hover:text-white">Deactivated</button>
            </div>
            <div id="staff-list-container" class="space-y-2"></div>
        </div>
    </div>
</div>
