<div class="space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-extrabold text-white uppercase tracking-wider">Security & Access</h2>
    </div>
    
    <div class="grid grid-cols-2 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs font-bold text-slate-400">
        <button id="sec-tab-dir" onclick="switchSecurityTab('dir')" class="py-2 rounded-lg bg-indigo-600 text-white shadow-sm transition-colors">Main Director</button>
        <button id="sec-tab-assoc" onclick="switchSecurityTab('assoc')" class="py-2 rounded-lg hover:text-white transition-colors">Assoc. Director</button>
    </div>
    
    <form onsubmit="handleUpdateDirectorSecurity(event)" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow-xs">
        <div class="flex items-center space-x-2 text-indigo-400 mb-2">
            <i class="fa-solid fa-shield-halved"></i>
            <h3 class="font-extrabold text-xs uppercase text-white">Update Master Credentials</h3>
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">NEW LOGIN PASSWORD</label>
            <input type="password" id="sec-new-pass" required placeholder="••••••••" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500">
        </div>
        <div>
            <label class="block text-[10px] font-bold text-slate-400 mb-1">NEW 6-DIGIT SECURITY PIN</label>
            <input type="password" id="sec-new-pin" maxlength="6" required placeholder="••••••" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-center tracking-widest font-mono focus:border-indigo-500">
        </div>
        <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-xs touch-btn shadow-md transition-colors mt-2">Update Security Credentials</button>
    </form>
</div>
