<div class="space-y-4">
    <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-extrabold text-white uppercase tracking-wider">Ledger & Payroll</h2>
        <button onclick="loadFinancialLedger()" class="text-xs text-indigo-400 font-bold touch-btn"><i class="fa-solid fa-arrows-rotate mr-1"></i> Sync</button>
    </div>
    
    <!-- Live Profit / Loss Tracking -->
    <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-slate-900 p-2 rounded-xl border border-slate-800"><span class="block text-[9px] text-slate-400 uppercase">Fees In</span><span id="pl-fees" class="text-sm font-mono font-bold text-emerald-400">₹0</span></div>
        <div class="bg-slate-900 p-2 rounded-xl border border-slate-800"><span class="block text-[9px] text-slate-400 uppercase">Payroll</span><span id="pl-staff" class="text-sm font-mono font-bold text-rose-400">₹0</span></div>
        <div class="bg-slate-900 p-2 rounded-xl border border-slate-800"><span class="block text-[9px] text-slate-400 uppercase">Expense</span><span id="pl-exp" class="text-sm font-mono font-bold text-rose-400">₹0</span></div>
        <div class="bg-indigo-600/20 p-2 rounded-xl border border-indigo-500/30"><span class="block text-[9px] text-indigo-300 uppercase">Net Profit</span><span id="pl-net" class="text-sm font-mono font-bold text-indigo-400">₹0</span></div>
    </div>
    
    <!-- Ledger Navigation -->
    <div class="grid grid-cols-3 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs font-bold text-slate-400">
        <button id="ledg-tab-students" onclick="switchLedgerTab('students')" class="py-2 rounded-lg bg-indigo-600 text-white shadow-sm transition-colors">Students</button>
        <button id="ledg-tab-staff" onclick="switchLedgerTab('staff')" class="py-2 rounded-lg hover:text-white transition-colors">Staff</button>
        <button id="ledg-tab-expenses" onclick="switchLedgerTab('expenses')" class="py-2 rounded-lg hover:text-white transition-colors">Expenses</button>
    </div>
    
    <!-- Student Ledger -->
    <div id="ledger-students" class="space-y-4">
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800"><span class="block text-[10px] text-slate-400">All Active</span><span id="ledg-stu-all" class="text-sm font-mono font-bold text-white">0</span></div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800"><span class="block text-[10px] text-slate-400">Paid Amount</span><span id="ledg-stu-paid" class="text-sm font-mono font-bold text-emerald-400">₹0</span></div>
            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800"><span class="block text-[10px] text-slate-400">Unpaid Dues</span><span id="ledg-stu-unpaid" class="text-sm font-mono font-bold text-rose-400">₹0</span></div>
        </div>
        <div class="flex space-x-2 text-[10px] font-bold overflow-x-auto pb-2 hide-scrollbar">
            <button onclick="filterStudentLedger('ALL')" id="fl-stu-ALL" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white shrink-0 transition-colors">All</button>
            <button onclick="filterStudentLedger('PAID')" id="fl-stu-PAID" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 shrink-0 hover:text-white transition-colors">Paid</button>
            <button onclick="filterStudentLedger('UNPAID')" id="fl-stu-UNPAID" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 shrink-0 hover:text-white transition-colors">Unpaid</button>
            <button onclick="filterStudentLedger('PARTIAL')" id="fl-stu-PARTIAL" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 shrink-0 hover:text-white transition-colors">Partial</button>
            <button onclick="filterStudentLedger('LEFT_TUITION')" id="fl-stu-LEFT_TUITION" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 shrink-0 hover:text-white transition-colors">Left Firm</button>
        </div>
        <div id="director-fees-list-container" class="space-y-2"></div>
    </div>
    
    <!-- Staff Ledger -->
    <div id="ledger-staff" class="hidden space-y-4">
        <div class="flex space-x-2 text-[10px] font-bold mb-2">
            <button onclick="filterStaffLedger('ALL')" id="fl-stf-ALL" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white transition-colors">All</button>
            <button onclick="filterStaffLedger('PAID')" id="fl-stf-PAID" class="px-3 py-1.5 rounded-lg bg-slate-900 text-slate-400 border border-slate-800 hover:text-white transition-colors">Paid</button>
        </div>
        <div id="ledger-staff-list" class="space-y-2"></div>
    </div>

    <!-- Expenses Ledger -->
    <div id="ledger-expenses" class="hidden space-y-4">
        <form onsubmit="handleLogExpense(event)" class="bg-slate-900 p-4 rounded-xl border border-slate-800 space-y-3 shadow-xs">
            <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">EXPENSE DESCRIPTION</label><input type="text" id="exp-desc" required placeholder="e.g., Markers, Electricity" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
                <div><label class="block text-[10px] font-bold text-slate-400 mb-1">AMOUNT (₹)</label><input type="number" id="exp-amount" required placeholder="1000" class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs font-mono focus:border-indigo-500"></div>
            </div>
            <div><label class="block text-[10px] font-bold text-slate-400 mb-1">REMARKS (REASON)</label><input type="text" id="exp-remarks" placeholder="Optional details..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs focus:border-indigo-500"></div>
            <button type="submit" class="w-full py-2 bg-amber-600 hover:bg-amber-500 text-white font-bold rounded-lg text-xs touch-btn shadow-xs transition-colors">Log Expense</button>
        </form>
        <div id="ledger-expense-list" class="space-y-2"></div>
    </div>
</div>
