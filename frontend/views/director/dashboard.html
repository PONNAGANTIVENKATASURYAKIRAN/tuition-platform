<div class="space-y-4">
  <div class="flex items-center justify-between border-b border-slate-800 pb-2">
    <h2 class="text-sm font-extrabold text-white uppercase tracking-wider">Live Supervision Dashboard</h2>
    <button onclick="window.loadDashboardData()" class="text-xs text-indigo-400 font-bold touch-btn hover:text-indigo-300 transition-colors">
      <i class="fa-solid fa-rotate-right mr-1"></i> Refresh System
    </button>
  </div>

  <div class="grid grid-cols-3 gap-2 text-center text-xs">
    <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 shadow-xs flex flex-col justify-center">
      <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-widest">Active Enrolled</span>
      <span id="dash-total-students" class="text-2xl font-mono font-bold text-indigo-400 mt-1 block">0</span>
    </div>
    <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 shadow-xs flex flex-col justify-center">
      <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-widest">Active Tutors</span>
      <span id="dash-total-tutors" class="text-2xl font-mono font-bold text-emerald-400 mt-1 block">0</span>
    </div>
    <div class="p-3 bg-slate-900 rounded-2xl border border-slate-800 shadow-xs flex flex-col justify-center">
      <span class="text-slate-400 block text-[10px] uppercase font-bold tracking-widest">Total Faculty</span>
      <span id="dash-total-faculty" class="text-2xl font-mono font-bold text-amber-400 mt-1 block">0</span>
    </div>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3 bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-sm">
    <div class="space-y-1">
      <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider">Filter Date</label>
      <input type="date" id="filter-date" onchange="window.renderStudentsList()" class="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs font-mono focus:border-indigo-500 outline-none transition-colors">
    </div>
    <div class="space-y-1">
      <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider">Class / Grade</label>
      <select id="filter-class" onchange="window.handleDashboardClassChange()" class="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs focus:border-indigo-500 outline-none transition-colors appearance-none">
        <option value="ALL">All Classes</option>
        <option value="1">Class 1</option><option value="2">Class 2</option><option value="3">Class 3</option>
        <option value="4">Class 4</option><option value="5">Class 5</option><option value="6">Class 6</option>
        <option value="7">Class 7</option><option value="8">Class 8</option><option value="9">Class 9</option>
        <option value="10">Class 10</option>
        <option value="Inter 1">Inter 1st Year</option>
        <option value="Inter 2">Inter 2nd Year</option>
        <option value="B.Tech">B.Tech</option>
      </select>
    </div>
    <div class="space-y-1">
      <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider">Board / Stream</label>
      <select id="filter-board" onchange="window.renderStudentsList()" class="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs focus:border-indigo-500 outline-none transition-colors appearance-none">
        <option value="ALL">All Boards / Streams</option>
        <option value="SSC">SSC (State Board)</option>
        <option value="CBSE">CBSE</option>
        <option value="ICSE">ICSE</option>
      </select>
    </div>
    <div class="space-y-1">
      <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider">Gender</label>
      <select id="filter-gender" onchange="window.renderStudentsList()" class="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs focus:border-indigo-500 outline-none transition-colors appearance-none">
        <option value="ALL">All Genders</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>
    <div class="space-y-1">
      <label class="block text-[9px] font-bold text-slate-500 uppercase tracking-wider">Performance Tier</label>
      <select id="filter-percentage" onchange="window.renderStudentsList()" class="w-full px-2.5 py-2 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs focus:border-indigo-500 outline-none transition-colors appearance-none">
        <option value="ALL">All Scores</option>
        <option value="NEEDS_HELP">Needs Help (&lt; 50%)</option>
        <option value="AVERAGE">Average (50% - 74%)</option>
        <option value="EXCELLENT">Excellent (75% - 89%)</option>
        <option value="PERFECT">Perfect (Above 90%)</option>
      </select>
    </div>
  </div>

  <div class="grid grid-cols-3 p-1.5 bg-slate-900 rounded-2xl border border-slate-800 text-xs font-bold text-slate-400">
    <button id="dash-tab-students" onclick="window.switchPillar('students')" class="py-2.5 rounded-xl bg-indigo-600 text-white shadow-md transition-all">Student Roster</button>
    <button id="dash-tab-tutors" onclick="window.switchPillar('tutors')" class="py-2.5 rounded-xl hover:text-white transition-all">Floor Tutors</button>
    <button id="dash-tab-faculty" onclick="window.switchPillar('faculty')" class="py-2.5 rounded-xl hover:text-white transition-all">Senior Faculty</button>
  </div>

  <div id="dash-panel-students" class="space-y-3">
    <div class="flex flex-wrap gap-2 text-[10px] font-bold">
      <button onclick="window.filterBucket('ALL')" id="bucket-ALL" class="px-4 py-2 rounded-xl bg-indigo-600 text-white shadow-md transition-colors border border-indigo-500">All</button>
      <button onclick="window.filterBucket('PRESENT')" id="bucket-PRESENT" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:text-white transition-colors">Present</button>
      <button onclick="window.filterBucket('ABSENT')" id="bucket-ABSENT" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:text-white transition-colors">Absent</button>
      <button onclick="window.filterBucket('LATE')" id="bucket-LATE" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:text-white transition-colors">Late</button>
      <button onclick="window.filterBucket('EARLY')" id="bucket-EARLY" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:text-white transition-colors">Early Leave</button>
      <button onclick="window.filterBucket('UNMARKED')" id="bucket-UNMARKED" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 hover:text-white transition-colors">Unmarked</button>
      <button onclick="window.filterBucket('LEFT')" id="bucket-LEFT" class="px-4 py-2 rounded-xl bg-slate-900 border border-slate-700 text-rose-400 hover:bg-rose-950/30 hover:border-rose-900 transition-colors ml-auto">Left Firm</button>
    </div>
    
    <div id="list-students" class="space-y-2.5"></div>
  </div>

  <div id="dash-panel-tutors" class="hidden space-y-3">
    <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
      <span class="text-xs font-bold text-slate-400 ml-2 uppercase tracking-wider">Tutor Directory</span>
      <select id="filter-tutor-gender" onchange="window.renderTutorsList()" class="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs outline-none">
        <option value="ALL">All Genders</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>
    <div id="list-tutors" class="space-y-2.5"></div>
  </div>

  <div id="dash-panel-faculty" class="hidden space-y-3">
    <div class="flex items-center justify-between bg-slate-900 p-2 rounded-xl border border-slate-800">
      <span class="text-xs font-bold text-slate-400 ml-2 uppercase tracking-wider">Faculty Directory</span>
      <select id="filter-faculty-gender" onchange="window.renderFacultyList()" class="px-3 py-1.5 bg-slate-950 border border-slate-700 rounded-lg text-white text-xs outline-none">
        <option value="ALL">All Genders</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
      </select>
    </div>
    <div id="list-faculty" class="space-y-2.5"></div>
  </div>
</div>

<!-- Modal for Staff Leave Reason Logging -->
<div id="modal-staff-leave-reason" class="hidden fixed inset-0 z-[80] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
  <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 shadow-2xl">
    <div class="flex items-center justify-between pb-2 border-b border-slate-800">
      <h4 class="font-extrabold text-white text-sm">Log Staff Leave</h4>
      <button onclick="window.closeStaffLeaveModal()" class="text-slate-400 hover:text-white transition-colors"><i class="fa-solid fa-xmark text-lg"></i></button>
    </div>
    <div class="space-y-3">
      <div class="p-3 bg-slate-950 rounded-xl border border-slate-800">
        <p class="text-[10px] text-slate-400 uppercase font-bold mb-1">Leave Type Selected</p>
        <p id="staff-leave-type-display" class="font-mono text-sm font-bold text-amber-400"></p>
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">Reason For Leave (Required)</label>
        <input type="text" id="staff-leave-reason-input" placeholder="e.g., Medical, Family Emergency, Out of Station" class="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white text-xs focus:border-indigo-500 outline-none transition-colors">
      </div>
      <button type="button" onclick="window.confirmStaffLeave()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl shadow-lg transition-colors">Confirm & Update Payroll Ledger</button>
    </div>
  </div>
</div>
