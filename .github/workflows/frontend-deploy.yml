name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Sync Static Files to S3 Bucket
        run: |
          # Fetch bucket name dynamically matching the new krishna-tuition prefix
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'krishna-tuition-frontend-')].Name | [0]" --output text)

          if [ "$BUCKET_NAME" != "None" ] && [ -n "$BUCKET_NAME" ]; then
            echo "Deploying frontend assets to: $BUCKET_NAME"
            aws s3 sync frontend/ s3://$BUCKET_NAME/ --delete
          else
            echo "Error: Target S3 bucket starting with 'krishna-tuition-frontend-' not found. Run Terraform apply first."
            exit 1
          fi

      - name: Invalidate CloudFront Cache (Optional Edge Refresh)
        run: |
          # Retrieve CloudFront distribution ID to clear CDN cache after file upload
          DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?contains(Origins.Items[0].Id, 'krishna-tuition-frontend-')].Id | [0]" --output text)

          if [ "$DIST_ID" != "None" ] && [ -n "$DIST_ID" ]; then
            echo "Creating CloudFront invalidation for distribution: $DIST_ID"
            aws cloudfront create-invalidation --distribution-id $DIST_ID --paths "/*"
          else
            echo "CloudFront distribution not found or not required; skipping cache invalidation."
          fi