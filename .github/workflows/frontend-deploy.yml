name: Frontend CI / Verification

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Static Files Integrity
        run: |
          test -f frontend/index.html
          test -f frontend/tutor.html
          test -f frontend/faculty.html
          test -f frontend/director.html
          test -f frontend/js/config.js
          echo "All dashboard static assets verified."